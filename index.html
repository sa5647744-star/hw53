<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lesson_49 Adaptive menu</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="./css/main.css">
    </head>
    <body>
        <!-- Зробити адаптивне Меню!  -->
        <header class="header">
            <div class="container">
                <div class="wrapper">
                    <div class="logo">
                        <a href="#">
                            <img src="./assets/img/logo.png" alt="Logo Company">
                        </a>
                    </div>
                    <nav class="nav">
                        <input type="checkbox" id="nav-burger"
                            class="nav__burger burger">
                        <label for="nav-burger" class="burger__img"></label>

                        <ul class="menu">
                            <li class="menu__item">
                                <a href="https://google.com"
                                    class="menu__link">Home</a>
                            </li>
                            <li class="menu__item">
                                <a href="https://google.com"
                                    class="menu__link">About</a>
                            </li>
                            <li class="menu__item">
                                <a href="https://google.com"
                                    class="menu__link">Products</a>
                            </li>
                            <li class="menu__item">
                                <a href="https://google.com"
                                    class="menu__link">Use Cases</a>
                            </li>
                            <li class="menu__item">
                                <a href="https://google.com"
                                    class="menu__link">Pricing</a>
                            </li>
                            <li class="menu__item">
                                <a href="https://google.com"
                                    class="menu__link">Resources</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>
        
        <div class="first-scr">
            <img src="./assets/img/background_first_screen.png"
            alt="Search icon" class="icon">
        </div>

    </body>
</html>
